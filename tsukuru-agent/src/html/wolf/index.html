<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <script src="../../lib/enlang/enlang.js"></script>
    <link rel="stylesheet" href="../../lib/sweetalert2/css.css">
    <script src="../../lib/sweetalert2/main.js"></script>
    <link href="./back.css" rel="stylesheet">

    <title>Tsukuru Agent</title>
</head>

<body draggable="false">
    <div class="alligner">
        <div id="loading_bar">
            <div id="loading-text">0%</div>
            <button type="button" id="icon1" class="icon" aria-label="Close">&times;</button>
            <button type="button" id="icon2" class="icon" aria-label="Minimize">-</button>
            <div id="border_r"></div>
        </div>
    </div>
    <div id="simpleMenu" style="display: none">
        <div class="alligner">
            <div class="center gaps">
                <p class="info" enlang="Game Folder:" id="fold">게임 폴더:</p>
                <input type="text" id="folder_input" class="highlight2 vw7">
                <button type="button" id="sel" class="highlight2" enlang="Select">선택</button>
            </div>
            <div class="center gaps">
                <button type="button" class="btnx" id="marTrans" enlang="Extract">추출모드</button>
                <button type="button" class="btnx" id="handTrans" enlang="Apply">적용모드</button>
            </div>
            <div class="alligner" id="marCont" style="display: none">
                <div class="center">
                    <div class="center2 gaps">
                        <div class="options-grid">
                            <button type="button" class="btn" id="ext-buran" enlang="Extract Unstable" btn-val="extBuran">
                                불안정 추출
                            </button>
                            <button type="button" class="btn" id="extpat" enlang="Pattern Based Extraction" btn-val="extPattern">
                                패턴 기반 추출
                            </button>
                            <button type="button" class="btn" id="ext-all" enlang="Extract All" btn-val="extAll">
                                모두 추출
                            </button>
                        </div>
                        <button type="button" id="runbtn" class="runbtn">RUN</button>
                        <button type="button" id="cancelbtn" class="runbtn" enlang="Cancel">취소</button>
    
                    </div>
                </div>
            </div>
            <div class="alligner" id="handCont" style="display: none">
                <div class="center">
                    <div class="center2 gaps">
                        <div class="options-grid" aria-hidden="true"></div>
                        <button type="button" id="runbtn2" class="runbtn">RUN</button>
                        <button type="button" id="cancelbtn2" class="runbtn" enlang="Cancel">취소</button>

                    </div>
                </div>
            </div>
        </div>
        <div id="addons-block" class="center">
            <div id="addons" class="highlight">
                <div class="container2">
                    <button type="button" class="btn" id="eztrans" enlang="Machine Translator">기계 번역</button>
                    <button type="button" class="btn" id="changeAll" enlang="Replace All Strings">문자열 일괄 변경</button>
                    <button type="button" class="btn" id="versionUp" enlang="Version-Up Tool">버전 업 툴</button>
                    <button type="button" class="btn" id="settings" enlang="Config">설정</button>
                </div>
            </div>
        </div>
    </div>
    <div class="center smalmar" style="display: none;">
        <button type="button" class="btnx" id="WolfBtn">MV/MZ</button>
        <button type="button" class="btnx btxSel" aria-current="page">Wolf</button>
    </div>
    <script src="./rend.js"></script>
</body>
</html>
