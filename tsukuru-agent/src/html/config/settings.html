<!DOCTYPE html>
<html lang="ko">
    <head>
        <script src="../../lib/enlang/enlang.js"></script>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
        <link href="./styles.css" rel="stylesheet">
        <title>Tsukuru Agent Settings</title>
    </head>
    <body>
        <div id="container">
            <label class="boxc">
                <span enlang="Show progress percentage">진행도 퍼센트 표시</span>
                <input type="checkbox" id="loadingText">
            </label><br>
            <label class="boxc">
                <span enlang="Keep line breaks in applied JSON">적용 JSON에서 줄바꿈 사용</span>
                <input type="checkbox" id="JsonChangeLine">
            </label><br>
            <label class="boxc">
                <span enlang="Do not machine-translate strings containing Korean">기계번역 시 한글을 포함한 문자열 번역하지 않기</span>
                <input type="checkbox" id="DoNotTransHangul">
            </label><br>
            <label class="boxc">
                <span enlang="Extract empty strings">내용 없는 문자열 추출</span>
                <span class="rec">(MV/MZ)</span>
                <input type="checkbox" id="ExtractAddLine">
            </label><br>
            <label for="userdict"><span enlang="Machine translation user dictionary">기계번역 사용자 사전</span></label><br>
            <textarea id="userdict" spellcheck="false" placeholder="Hina=히나&#10;橋本=하시모토&#10;ひかり=히카리&#10;.."></textarea><br>
            <details>
                <summary><span enlang="Advanced settings: expand/collapse">고급 설정: [접기/펼치기]</span></summary>
                <br><div class="boxc warn" enlang="Changing advanced settings can cause machine translation problems">고급 설정을 변경 할 시 기계번역에 문제가 생길 수 있습니다</div><br>
                <label class="boxc">
                    <span enlang="Extract scripts into a separate file">별도의 파일로 스크립트 추출</span>
                    <span class="rec">(MV/MZ)</span>
                    <input type="checkbox" id="onefile_src">
                </label><br>
                <label class="boxc">
                    <span enlang="Extract notes into a separate file">별도의 파일로 노트 추출</span>
                    <span class="rec">(MV/MZ)</span>
                    <input type="checkbox" id="onefile_note">
                </label><br>
                <label class="boxc">
                    <span enlang="Extract ExternMessage.csv separately">ExternMessage.csv 다른 파일로 추출</span>
                    <span class="rec">(MV/MZ)</span>
                    <input type="checkbox" id="ExternMsgJson">
                </label><br>
                <label class="boxc">
                    <span enlang="Combine map files">Map 파일 하나로 만들기</span>
                    <span class="rec">(MV/MZ)</span>
                    <input type="checkbox" id="oneMapFile">
                </label><br>
                <label class="boxc">
                    <span enlang="Add separators for easier extraction review">추출 시 구분을 편하게 만들기</span>
                    <span class="rec">(MV/MZ)</span>
                    <input type="checkbox" id="formatNice">
                </label><br>
                <label class="boxc">
                    <span enlang="Hide Extract All">모두 추출 숨기기</span>
                    <span class="rec">(Wolf)</span>
                    <input type="checkbox" id="HideExtractAll">
                </label><br>
                <label class="boxc">
                    <span enlang="Hide translators that are not recommended">비권장 번역기 숨기기</span>
                    <input type="checkbox" id="hideUnrecomenedTranslators">
                </label><br>
                <label class="boxc" for="extractPlus">
                    <span enlang="Also extract data with these codes">다음 code를 가진 데이터를 추가로 추출하기</span>
                    <span class="rec">(MV/MZ)</span>
                </label>
                <textarea id="extractPlus" spellcheck="false" placeholder="122&#10;300&#10;.."></textarea><br>
                <label class="boxc">
                    <span enlang="Extract only scripts and notes containing specified strings">특정 문자열을 가진 스크립트/노트만 추출</span>
                    <input type="checkbox" id="extractSomeScript">
                </label>
                <textarea id="extractSomeScript2" class="invisible" spellcheck="false" placeholder="showtext&#10;maintext&#10;.."></textarea><br>
            </details><br>
            <button type="button" id="update" class="btn2" enlang="Check for updates">업데이트 확인</button>
            <button type="button" id="license" class="btn2" enlang="Open-source licenses">오픈소스 라이센스</button>
        </div>
        <button type="button" id="apply" class="btn" enlang="Apply">적용</button>
        <button type="button" id="close" class="btn" enlang="Cancel">취소</button>
        <script src="./script.js"></script>
    </body>
</html>
