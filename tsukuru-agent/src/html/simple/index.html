<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <script src="../../lib/enlang/enlang.js"></script>
    <link href="./back.css" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/sweetalert2/css.css">
    <script src="../../lib/sweetalert2/main.js"></script>

    <title>Tsukuru Agent</title>
</head>

<body draggable="false">
    <div class="alligner">
        <div id="loading_bar">
            <div id="loading-text">0%</div>
            <button type="button" id="icon1" class="icon" aria-label="Close">&times;</button>
            <button type="button" id="icon2" class="icon" aria-label="Minimize">-</button>
            <div id="border_r"></div>
        </div>
    </div>
    <div id="mainMenu" style="display: none">
        <div class="alligner">
            <div class="center mt">
                <img src="./icon.png" width="128px" height="128px">
            </div>
            <div class="center">
                <h1>Tsukuru Agent</h1>
            </div>
            <span class="subtitle center" enlang="Tool for Translating Games">(구) MVExtractor++</span>
        </div>
        <div class="box-cont">
            <button type="button" class="box" id="gokupu">
                <span class="box-title">RPG MV/MZ</span>
            </button>
            <button type="button" class="box" id="simpuru">
                <span class="box-title">Wolf RPG</span>
            </button>
        </div>
    </div>
    <div class="flags">
        <button type="button" class="box2" id="lang-en">English</button>
        <button type="button" class="box2" id="lang-ko">한국어</button>
    </div>
    <script src="./rend.js"></script>
</body>
</html>
