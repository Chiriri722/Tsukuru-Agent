name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tsukuru-agent

jobs:
  portable-tests:
    name: Portable tests (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsukuru-agent/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify
      - run: npm run test:coverage
      - run: npm run test:coverage:core
      - run: npm run test:order

  windows-package:
    name: Windows package (Node 22)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsukuru-agent/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run test:electron
      - run: npm run build:cli
      - run: npm run verify:package
      - name: Generate release checksums, manifest, and SBOM
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath dist-cli -Filter 'tsukuru-agent-*-win.zip')
          if ($artifacts.Count -ne 1) { throw "Expected exactly one CLI archive, found $($artifacts.Count)" }
          npm run release:evidence -- dist-cli/release-evidence $artifacts[0].FullName
      - uses: actions/upload-artifact@v7
        with:
          name: tsukuru-agent-windows-node22
          path: |
            tsukuru-agent/dist-cli/tsukuru-agent-*-win.zip
            tsukuru-agent/dist-cli/release-evidence/SHA256SUMS
            tsukuru-agent/dist-cli/release-evidence/release-manifest.json
            tsukuru-agent/dist-cli/release-evidence/sbom.spdx.json
          if-no-files-found: error
          retention-days: 7
