version: 2
updates:
  - package-ecosystem: npm
    directory: /tsukuru-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: electron
        update-types:
          - version-update:semver-major
      - dependency-name: electron-builder
        update-types:
          - version-update:semver-major
